<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatCave - Detalhes do Personagem</title>
    <link rel="stylesheet" href="./css/detalhesPersonagem.css">
    <link rel="stylesheet" href="./css/navBar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&family=Oswald:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="divNavBar">
        <nav class="navBar">
            <a href="./index.html">
                <img class="imgLogo" src="./assets/imgs/BatCaveLogoTemporario.png" alt="">
            </a>
            <div class="opcoesNavBar">
                <a class="opcoaoNavBar" href="./index.html">Home</a>
                <a class="opcoaoNavBar" href="./historias.html">Histórias</a>
                <a class="opcoaoNavBar opcaoSelecionada" href="./personagens.html">Personagens</a>
                <a class="opcoaoNavBar" href="./curiosidades.html">Curiosidades</a>
            </div>
            <div class="butoesNavBar" id="deslogado">
                <a class="botaoCadastro" href="./cadastro.html">Cadastre-se</a>
                <a class="botaoLogin" href="./login.html">Login</a>
            </div>
            <div class="usuarioLogado" id="logado" style="display: none;">
                <a href="./perfilLogin.html" class="divNomeIcone"> <span class="nomeUsuario" id="nomeUsuario"> </span>
                    <img src="./assets/icon/iconUsuario.png" class="imgLogado" alt=""> </a>
            </div>
        </nav>
        <script src="./js/navBar.js"></script>
    </header>

    <div class="bannerDetalhes">
        <img class="imgBannerDetalhes" id="bannerPersonagem" src="">
    </div>

    <div class="containerDetalhes">
        <div class="divImgPersonagem">
            <img class="imgPersonagem" id="capaPersonagem" src="">
        </div>
        <div class="divInformacoesPersonagem">
            <div class="divCabecalhoPersonagem">
                <span id="tituloPersonagem" class="tituloDetalhes"></span>
                <span class="spanMeta">Identidade secreta: <span id="identidadePersonagem"> </span></span>
                <span id="categoriaPersonagem" class="spanMeta"></span>
            </div>

            <div class="containerBotoesAcao">
                <button id="botaoFavoritar" class="botaoAcao">♡<span id="textoBotaoFavoritar" class="iconeBotao"></span></button>
                <div class="botaoAcao"><span class="iconeBotao">?</span> Fazer quiz</div>
            </div>

            <div class="cardInformacoes">
                <span class="tituloCardInformacoes">Informações:</span>
                <div class="listaInformacoes">
                    <span class="itemInformacao"><strong>Primeira Aparição:</strong> <span id="primeiraAparicao">
                        </span></span>
                    <span class="itemInformacao"><strong>Criadores:</strong> <span id="criadorPersonagem">
                        </span></span>
                    <span class="itemInformacao"><strong>Gênero:</strong> <span id="generoPersonagem"> </span> </span>
                    <span class="itemInformacao"><strong>Principais Afiliações:</strong> <span id="afiliacaoPersonagem">
                        </span></span>
                </div>
            </div>

            <span id="citacaoPersonagem" class="citacaoPersonagem"></span>
        </div>
    </div>

    <div class="secaoBiografia">
        <span class="tituloBiografia">Biografia</span>
        <span class="textoBiografia" id="biografiaPersonagem">
        </span>
    </div>

    <div id="containerEditor" class="containerEditor">
        <div class="infoEditor">
            <span class="tituloEditor">Comentário do editor</span>
            <img class="imgAvatarEditor" src="./assets/imgs/imgRianAlencar.jpe" alt="Avatar do editor">
            <span class="nomeEditor">Rian Alencar Souza</span>
        </div>
        <div class="textoEditor">
            <p id="comenEditor">
        </div>
    </div>
    <script src="./js/favoritar.js"></script>
    <script src="./js/detalhesPersonagem.js"></script>

</body>

</html>
