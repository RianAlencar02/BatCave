<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatCave - Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&family=Oswald:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
    <div class="divPaiDashboard">
        <div class="navBarAdm">
            <img src="../assets/imgs/dashboard/imgLogoDashboard.png" class="imgNavDash"
                alt="Imagem da NavBar Administrativa">
            <nav class="opcoesNavBar">
                <a class="opcaoNavBar opcaoSelecionada" href="./dashboard.html">Dashboard</a>
                <a class="opcaoNavBar" href="./usuarios.html">Usuários</a>
                <a class="opcaoNavBar" href="./historias.html">Histórias</a>
                <a class="opcaoNavBar" href="./personagens.html">Personagens</a>
            </nav>
            <a class="opcaoSair" href="./loginAdm.html">Sair</a>
        </div>
        <div class="conteudoDashboard">
            <div class="linhaKpi">
                <div class="kpiDashboard">
                    <span class="tituloKpi">Total de usuários</span>
                    <span class="dadoKpi">10</span>
                </div>
                <div class="kpiDashboard">
                    <span class="tituloKpi">Total de histórias</span>
                    <span class="dadoKpi">10</span>
                </div>
                <div class="kpiDashboard">
                    <span class="tituloKpi">Total de personagens:</span>
                    <span class="dadoKpi">10</span>
                </div>
                <div class="kpiDashboard">
                    <span class="tituloKpi">Quizes concluidos:</span>
                    <span class="dadoKpi">10</span>
                </div>
            </div>
            <div class="containerGraficos">
                <div class="graficoDashboard">
                    <span class="tituloKpi">Histórias mais bem avaliadas:</span>
                    <div class="containerItens">
                        <div class="item">
                            <img src="../assets/imgs/historias/bannerBatmanAbs.jpeg" class="imgItem" alt="">
                            <span class="dadoKpi">Batman Absoluto</span>
                            <div class="colunaAvaliacao">
                                <span class="dadoKpi">4.8</span>
                                <span class="textoAvaliacoes">12 avaliações</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="graficoDashboard">
                    <span class="tituloKpi">Favoritos por tipo:</span>
                    <div>
                        <canvas id="graficoTipo"></canvas>
                    </div>
                </div>
                <div class="graficoDashboard">
                    <span class="tituloKpi">Personagens mais favoritados:</span>
                    <div class="containerItens">
                        <div class="itemFavoritos">
                            <img src="../assets/imgs/personagens/imgRobinDick.webp" class="imgItem" alt="">
                            <span class="dadoKpi">Robin (Dick Grayson)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<script>
    const ctx = document.getElementById("graficoTipo");

    const tipos = ["Quadrinhos", "Filmes", "Jogos"];
    const favoritos = [11, 7, 4];

    Chart.defaults.font.family = "Inter, sans-serif";
    Chart.defaults.color = "#9aa5b1";

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: tipos,
            datasets: [
                {
                    label: "Favoritados",
                    data: favoritos,
                    backgroundColor: ["#c62839", "#3a6ea5", "#9aa5b1"],
                    borderRadius: 8,
                },
            ],
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: "#0b0b0d",
                    borderColor: "#23364d",
                    borderWidth: 1,
                    padding: 12,
                },
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { color: "#f2f4f7", font: { size: 14 } },
                },
                y: {
                    beginAtZero: true,
                    grid: { color: "#23364d" },
                },
            },
        },
    });
</script>
