<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatCave - Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&family=Oswald:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
    <div class="divPaiDashboard">
        <div class="navBarAdm">
            <img src="../assets/imgs/dashboard/imgLogoDashboard.png" class="imgNavDash"
                alt="Imagem da NavBar Administrativa">
            <nav class="opcoesNavBar">
                <a class="opcaoNavBar opcaoSelecionada" href="./dashboard.html">Dashboard</a>
                <a class="opcaoNavBar" href="./usuarios.html">Usuários</a>
                <a class="opcaoNavBar" href="./historias.html">Histórias</a>
                <a class="opcaoNavBar" href="./personagens.html">Personagens</a>
            </nav>
           <button id="botaoSairDashboard" class="opcaoSair">Sair</button>
        </div>
        <div id="telaDashboard" class="conteudoDashboard">
            <div class="linhaKpi">
                <div class="kpiDashboard">
                    <span class="tituloKpi">Total de usuários</span>
                    <span id="qntUsuarios" class="dadoKpi"></span>
                </div>
                <div class="kpiDashboard">
                    <span class="tituloKpi">Total de histórias</span>
                    <span id="qntHistorias" class="dadoKpi"></span>
                </div>
                <div class="kpiDashboard">
                    <span class="tituloKpi">Total de personagens:</span>
                    <span id="qntPersonagens" class="dadoKpi"></span>
                </div>
                <div class="kpiDashboard">
                    <span class="tituloKpi">Quizes concluidos:</span>
                    <span id="qntQuizesConcluidos" class="dadoKpi"></span>
                </div>
            </div>
            <div class="containerGraficos">
                <div class="graficoDashboard">
                    <span class="tituloKpi">Histórias mais bem avaliadas:</span>
                    <div id="divCardAvaliados" class="containerItens">

                    </div>
                </div>
                <div class="graficoDashboard">
                    <span class="tituloKpi">Favoritos por tipo:</span>
                    <div class="divGrafico">
                        <canvas id="graficoTipo"></canvas>
                    </div>
                </div>
                <div class="graficoDashboard">
                    <span class="tituloKpi">Personagens mais favoritados:</span>
                    <div id="divPersonagensFavoritados" class="containerItens">

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/dashboard.js"></script>
</body>

</html>

<script>

</script>
