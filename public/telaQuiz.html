<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatCave - Quiz</title>
    <link rel="stylesheet" href="./css/telaQuiz.css">
    <link rel="stylesheet" href="./css/navBar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&family=Oswald:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="divNavBar">
        <nav class="navBar">
            <a href="./index.html">
                <img class="imgLogo" src="./assets/imgs/BatCaveLogoTemporario.png" alt="">
            </a>
            <div class="opcoesNavBar">
                <a class="opcoaoNavBar" href="./index.html">Home</a>
                <a class="opcoaoNavBar" href="./historias.html">Histórias</a>
                <a class="opcoaoNavBar" href="./personagens.html">Personagens</a>
                <a class="opcoaoNavBar" href="./curiosidades.html">Curiosidades</a>
            </div>
            <div class="butoesNavBar" id="deslogado">
                <a class="botaoCadastro" href="./cadastro.html">Cadastre-se</a>
                <a class="botaoLogin" href="./login.html">Login</a>
            </div>
            <div class="usuarioLogado" id="logado" style="display: none;">
                <a href="./perfil.html" class="divNomeIcone"> <span class="nomeUsuario" id="nomeUsuario"> </span>
                    <img src="./assets/icon/iconUsuario.png" class="imgLogado" alt=""> </a>
            </div>
        </nav>
        <script src="./js/navBar.js"></script>
    </header>

    <main class="containerQuiz">
        <div class="cabecalhoProgresso">
            <span class="numeroQuestao">QUESTÃO <span id="contadorPergunta"></span>/5</span>
            <span id="categoriaQuiz" class="categoriaQuestao">Categoria</span>
        </div>

        <div class="enunciadoQuestao">
            <span id="textoPergunta" class="textoEnunciado"></span>
        </div>

        <div id="listagemAlternativas" class="listaAlternativas">
            <div class="alternativaQuestao">
                <span class="letraAlternativa">A</span>
                <span class="textoAlternativa">Alternativa A — Texto placeholder da primeira opção de resposta.</span>
            </div>

        </div>

        <div class="rodapeQuiz">
            <button type="button" id="botaoProximaQuestao" class="botaoProximaQuestao">Próxima questão</button>
        </div>
        <div class="overlay-quiz" id="resultado-quiz">
            <div class="card-resultado">
                <h2 class="titulo-resultado">Quiz finalizado</h2>

                <div class="centro-resultado">
                    <p class="acertos-resultado">Acertos <span id="acertos">X</span>/<span id="total">Y</span></p>
                    <p class="porcentagem-resultado">Você acertou <span id="porcentagem">XX</span>%</p>
                    <p id="fraseFinalQuiz" style="color: #f2f4f7; font-size: 15px;"></p>
                </div>

                <a href="historias.html" class="botao-resultado" id="botao-voltar">Voltar para a história</a>
            </div>
        </div>
    </main>

    <script type="module" src="./js/quiz.js"></script>
</body>

</html>
