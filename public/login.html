<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatCave - Login</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/navBar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&family=Oswald:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="divNavBar">
        <nav class="navBar">
            <a href="./index.html">
                <img class="imgLogo" src="./assets/imgs/BatCaveLogoTemporario.png" alt="">
            </a>
            <div class="opcoesNavBar">
                <a class="opcoaoNavBar" href="./index.html">Home</a>
                <a class="opcoaoNavBar" href="./historias.html">Histórias</a>
                <a class="opcoaoNavBar" href="./personagens.html">Personagens</a>
                <a class="opcoaoNavBar" href="./curiosidades.html">Curiosidades</a>
            </div>
            <div class="butoesNavBar" id="deslogado">
                <a class="botaoCadastro" href="./cadastro.html">Cadastre-se</a>
                <a class="botaoLogin" href="./login.html">Login</a>
            </div>
            <div class="usuarioLogado" id="logado" style="display: none;">
                <a href="./perfil.html" class="divNomeIcone"> <span class="nomeUsuario" id="nomeUsuario"> </span> <img src="./assets/icon/iconUsuario.png" class="imgLogado" alt=""> </a>
            </div>
        </nav>
        <script src="./js/navBar.js"></script>
    </header>

    <div class="divPaiHome">
        <div class="divMetadeFormulario">
            <div class="divFormulario">
                <span class="tituloLogin">Login</span>

                <div class="campo">
                    <label class="labelLogin" for="inputEmail">Email:</label>
                    <input type="email" class="inputLogin" id="inputEmail">
                    <span class="erro" id="erroEmail"></span>

                </div>

                <div class="campo">
                    <label class="labelLogin" for="inputSenha">Senha:</label>
                    <input type="password" class="inputLogin" id="inputSenha">
                    <span class="erro" id="erroSenha"></span>
                </div>

                <button class="botaoFazerLogin" onclick="logar()">Login</button>
                <a href="./dashboard/loginAdm.html" class="linkAcessoAdm"><span>Acesso administrativo</span></a>
            </div>
        </div>
        <div class="divMetadeImg"></div>
    </div>
            <div class="footer">
            <div class="divImgFooter">
                <img class="imgFooter" src="./assets/imgs/BatCaveLogoTemporario.png" alt="">    
            </div>
            <div class="divOpcoesFooter">
                <a class="linkFooter" href="./index.html">
                    <span class="opcaoFooter">Home</span>
                </a>
                <a class="linkFooter" href="./historias.html">
                    <span class="opcaoFooter">Histórias</span>
                </a>
                <a class="linkFooter" href="./personagens.html">
                    <span class="opcaoFooter">Personagens</span>
                </a>
                <span class="fraseFooter">2026 - BatCave: Um projeto de Rian Alencar Souza</span>
            </div>
            <div class="direitosFooter">
                <span class="fraseFooter">Todos os direitos reservados a: </span>
                <img class="imgDireitosFooter" src="./assets/icon/DC_Comics_logo.png" alt="">
            </div>
        </div>
</body>

</html>
<script src="./js/scriptLogin.js"></script>
