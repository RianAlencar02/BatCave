<!DOCTYPE html>
<html lang="en">

<head>

    <title>BatCave - Login</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&family=Oswald:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="divNavBar">
        <nav class="navBar">
            <a href="./index.html">
                <img class="imgLogo" src="./assets/imgs/BatCaveLogoTemporario.png" alt="">
            </a>
            <div class="opcoesNavBar">
                <a class="opcoaoNavBar opcaoSelecionada" href="./index.html">Home</a>

                <div class="campo">
                    <label class="labelLogin" for="inputSenha">Senha:</label>
                    <input type="password" class="inputLogin" id="inputSenha">

                <a href="./index.html" class="botaoFazerLogin">
                    <span >Login</span>
                </a>
            </div>
        </div>
        <div class="divMetadeImg"></div>
